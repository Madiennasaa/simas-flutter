name: simas_mobile
description: Aplikasi SIMAS SDN Sukorame 1 Kediri
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Network
  dio: ^5.4.3+1

  # Simpan token JWT dengan aman (bukan shared_preferences biasa)
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/tutwuri.png
